[project]
name = "movie-intelligence-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "numpy>=2.0",
    "openai>=1.50",
    "pandas>=2.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "datamodel-code-generator[http]>=0.26",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "schemathesis>=3.36",
]

# The default Linux torch wheel bundles CUDA (several GB). The container only needs CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["app/api_models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
